name: Build desktop app

# Builds the Windows installer and the Mac app, then publishes a GitHub Release
# named after the version in package.json (e.g. v1.0.0) with both files attached.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.1.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            file: release/flocktt-setup.exe
          # Mac: GitHub hasn't assigned a macOS runner to this repo (jobs were cancelled while queued).
          # Add this back once one is available:
          # - os: macos-15
          #   target: --mac
          #   file: release/flocktt-mac.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    # publish whatever built, so a slow or failed Mac build never blocks the Windows download
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: flock.tt ${{ steps.version.outputs.tag }}
          body: |
            **Windows:** download `flocktt-setup.exe` and run it. If Windows shows "Windows protected your PC", click **More info** → **Run anyway**.
            **Mac:** coming soon.
          files: dist/*
          fail_on_unmatched_files: false
          make_latest: true
