<html><head><meta charset="utf-8"><title>Social links</title>
<link rel="stylesheet" href="overlay.css">
<style>
  body { display: flex; align-items: center; height: 100vh; }
  .s { position: relative; margin: 0 10px; height: 74px; width: calc(100% - 20px); overflow: hidden; }
  .item { position: absolute; inset: 0; display: flex; align-items: center; gap: 14px; padding: 0 20px 0 12px; transition: transform .55s cubic-bezier(.3, 1.3, .5, 1), opacity .35s; }
  .item.out { transform: translateY(-110%); opacity: 0; }
  .item.next { transform: translateY(110%); opacity: 0; }
  .ic { flex: none; width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: var(--tt-a); color: var(--tt-on-accent); font: 800 15px var(--tt-display); letter-spacing: -.3px; }
  .ic svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .txt { min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
  .txt small { font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; opacity: .65; }
  .txt b { font-family: var(--tt-display); font-size: 26px; font-weight: 800; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); display: flex; gap: 5px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--tt-text); opacity: .25; transition: opacity .3s; }
  .dots i.on { opacity: .9; }
</style></head>
<body>
<div class="s panel shadow" id="s"><div class="dots" id="dots"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  // Your other places, one at a time. ?items=instagram:@you,youtube:@you,discord:discord.gg/you,x:@you,twitch:you,web:you.com
  // ?every=6 (seconds each). Any label works: ?items=Merch:shop.you.com
  const PLAT = {
    tiktok: ['TikTok', 'note'], instagram: ['Instagram', 'cam'], youtube: ['YouTube', 'play'], twitch: ['Twitch', 'chat'], x: ['X', 'at'], twitter: ['X', 'at'],
    discord: ['Discord', 'chat'], snapchat: ['Snapchat', 'ghost'], kick: ['Kick', 'play'], web: ['Website', 'globe'], site: ['Website', 'globe'], shop: ['Shop', 'bag'], merch: ['Merch', 'bag']
  };
  // simple, generic icons (no brand logos)
  const ICON = {
    note: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    cam: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>',
    play: '<rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/>',
    chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>',
    at: '<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>',
    ghost: '<path d="M12 3a6 6 0 0 0-6 6v4l-2 3h4l1 3 3-2 3 2 1-3h4l-2-3V9a6 6 0 0 0-6-6z"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    bag: '<path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    link: '<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>'
  };
  const raw = params.get('items') || 'instagram:@yourname,youtube:@yourname,discord:discord.gg/yourname';
  const items = raw.split(',').map((x) => x.trim()).filter(Boolean).map((x) => {
    const i = x.indexOf(':');
    const k = (i > 0 ? x.slice(0, i) : 'web').trim(), v = (i > 0 ? x.slice(i + 1) : x).trim();
    const p = PLAT[k.toLowerCase()];
    return { label: p ? p[0] : k, icon: p ? p[1] : 'link', value: v };
  }).filter((x) => x.value);
  const box = document.getElementById('s'), dots = document.getElementById('dots');
  const nodes = items.map((it) => el('div', { class: 'item next' }, el('div', { class: 'ic', innerHTML: `<svg viewBox="0 0 24 24">${ICON[it.icon]}</svg>` }), el('div', { class: 'txt' }, el('small', {}, it.label), el('b', {}, it.value))));
  box.prepend(...nodes);
  if (items.length > 1) dots.append(...items.map(() => el('i')));
  let i = -1;
  function turn() {
    if (!nodes.length) return;
    if (i >= 0) { nodes[i].className = 'item out'; const old = nodes[i]; setTimeout(() => { if (old.classList.contains('out')) old.className = 'item next'; }, 600); }
    i = (i + 1) % nodes.length;
    nodes[i].className = 'item';
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  }
  io(); // tells flock.tt this overlay is on stream
  turn();
  if (nodes.length > 1) setInterval(turn, Math.max(3, Number(params.get('every')) || 6) * 1000);
</script>
</body></html>
