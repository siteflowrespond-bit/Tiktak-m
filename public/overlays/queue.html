<html><head><meta charset="utf-8"><title>Viewer queue</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .q { margin: 10px; padding: 14px 16px 16px; width: calc(100% - 20px); box-sizing: border-box; }
  .top { display: flex; align-items: baseline; gap: 10px; }
  .title { font-size: 14px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; opacity: .75; flex: 1; }
  .state { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--tt-line); }
  .state.open { background: var(--tt-a); color: var(--tt-on-accent); border-color: var(--tt-a); text-shadow: none; }
  .now { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--tt-a); }
  .now small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; opacity: .7; }
  .now b { font-size: 20px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 2px; font-size: 17px; font-weight: 700; animation: in .4s cubic-bezier(.2, 1.4, .4, 1); }
  .row .n { width: 22px; text-align: right; opacity: .6; font-variant-numeric: tabular-nums; }
  .empty { margin-top: 10px; font-size: 15px; font-weight: 600; opacity: .7; }
  .more { margin-top: 4px; font-size: 13px; font-weight: 700; opacity: .6; }
  @keyframes in { from { opacity: 0; transform: translateX(-12px); } }
</style></head>
<body>
<div class="q panel shadow" id="q"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  // ?count=6 (names shown)  ?title=Play with me  ?bg=0
  const box = document.getElementById('q');
  const count = Number(params.get('count')) || 6;
  if (params.get('bg') === '0') box.classList.remove('panel');
  let cmd = '!join';
  const sock = io();
  sock.on('config', (c) => { cmd = c.queue?.command || '!join'; });
  sock.on('queue', (q) => {
    const list = q.list || [];
    box.replaceChildren(...[
      el('div', { class: 'top' }, el('div', { class: 'title' }, params.get('title') || 'Queue'), el('span', { class: `state${q.open ? ' open' : ''}` }, q.open ? `Type ${cmd}` : 'Closed')),
      q.current ? el('div', { class: 'now' }, avatarEl(q.current, 34), el('div', {}, el('small', {}, 'Up now'), el('b', {}, q.current.nickname))) : null,
      list.length ? list.slice(0, count).map((x, i) => el('div', { class: 'row' }, el('span', { class: 'n' }, String(i + 1)), avatarEl(x, 26), el('span', {}, x.nickname))) : el('div', { class: 'empty' }, q.open ? 'Nobody in line yet' : 'The queue is closed'),
      list.length > count ? el('div', { class: 'more' }, `+${list.length - count} more`) : null].flat().filter(Boolean));
  });
</script>
</body></html>
