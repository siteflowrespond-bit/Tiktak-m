<!doctype html>

<html><head><meta charset="utf-8"><title>Starting soon</title>
<link rel="stylesheet" href="overlay.css">
<style>
  html, body { height: 100%; }
  body { background: var(--scr-bg, #050506); }
  body.clear { background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6vmin; gap: 2.4vmin; }
  .kicker { font-size: max(14px, 2.2vmin); font-weight: 800; letter-spacing: .4em; text-transform: uppercase; opacity: .6; }
  .big { font-family: var(--tt-display); font-size: max(44px, 9vmin); font-weight: 800; letter-spacing: -.04em; line-height: .95; animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.025); } }
  .msg { font-size: max(18px, 3vmin); font-weight: 600; opacity: .8; max-width: 80vw; }
  .count { font-family: var(--tt-display); font-size: max(30px, 6.5vmin); font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    padding: .2em .7em; border-radius: 999px; background: var(--tt-a); color: var(--tt-on-accent); }
  .count:empty { display: none; }
  .chips { display: flex; gap: 1.4vmin; flex-wrap: wrap; justify-content: center; margin-top: 1vmin; }
  .chip { display: inline-flex; align-items: center; gap: .6em; padding: .55em 1.1em; font-size: max(14px, 2.2vmin); font-weight: 700; border-radius: 999px; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip:empty { display: none; }
  .center > * { animation: in .9s cubic-bezier(.2, 1.2, .4, 1) both; }
  .center > :nth-child(2) { animation-delay: .1s; } .center > :nth-child(3) { animation-delay: .2s; } .center > :nth-child(4) { animation-delay: .3s; } .center > :nth-child(5) { animation-delay: .4s; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } }
</style></head>
<body>
<canvas id="c"></canvas>
<div class="center">
  <div class="kicker" id="kicker"></div>
  <div class="big shadow" id="big"></div>
  <div class="msg shadow" id="msg"></div>
  <div class="count num" id="count"></div>
  <div class="chips" id="chips"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  // A full-screen card for before, during a break, and after your LIVE, over a moving flock.
  // ?mode=starting|brb|ending  ?title=…  ?text=…  ?mins=5 (count down from now) or ?until=20:30 (count down to a time)
  // ?stats=0 (hide viewers / likes / latest follower)  ?bg=0 (transparent, flock only)  ?flock=0 (no flock)
  const MODES = {
    starting: ['Get comfy', 'Starting soon', 'The LIVE is about to start. Grab a drink and say hi in chat!'],
    brb: ['Short break', 'Be right back', "Don't go anywhere. Back in a moment!"],
    ending: ['That\'s a wrap', 'Thanks for watching', 'Follow so you don\'t miss the next LIVE.']
  };
  const mode = MODES[params.get('mode')] ? params.get('mode') : 'starting';
  const [kick, big, msg] = MODES[mode];
  document.title = big;
  document.getElementById('kicker').textContent = params.get('kicker') ?? kick;
  document.getElementById('big').textContent = params.get('title') || big;
  document.getElementById('msg').textContent = params.get('text') ?? msg;
  if (params.get('bg') === '0') document.body.classList.add('clear');

  // countdown
  let endAt = 0;
  if (Number(params.get('mins')) > 0) endAt = Date.now() + Number(params.get('mins')) * 60000;
  const until = /^(\d{1,2}):(\d{2})$/.exec(params.get('until') || '');
  if (until) { const d = new Date(); d.setHours(Number(until[1]), Number(until[2]), 0, 0); if (d < Date.now()) d.setDate(d.getDate() + 1); endAt = d.getTime(); }
  function tick() {
    if (!endAt) return;
    const s = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    document.getElementById('count').textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : (mode === 'brb' ? 'Back now!' : mode === 'ending' ? 'Bye!' : 'Starting now!');
  }
  tick(); setInterval(tick, 500);

  // live numbers
  const showStats = params.get('stats') !== '0';
  let viewers = 0, likes = 0, follower = '';
  function chips() {
    if (!showStats) return;
    const c = [];
    if (viewers) c.push(el('span', { class: 'chip panel' }, el('b', {}, fmt(viewers)), mode === 'ending' ? 'watched' : 'here'));
    if (likes) c.push(el('span', { class: 'chip panel' }, el('b', {}, fmt(likes)), 'likes'));
    if (follower) c.push(el('span', { class: 'chip panel' }, 'Newest follower', el('b', {}, follower)));
    document.getElementById('chips').replaceChildren(...c);
  }
  const sock = io();
  sock.on('stats', (s) => { viewers = s.viewers || 0; likes = s.likes || 0; chips(); });
  sock.on('recent', (list) => { const f = (list || []).find((e) => e.type === 'follow'); if (f) { follower = f.user.nickname; chips(); } });
  sock.on('event', (e) => { if (e.type === 'follow') { follower = e.user.nickname; chips(); } });

  // the flock: a few hundred dots that steer together like starlings
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W, H, dpr;
  const birds = [];
  function size() { dpr = ttDPR(); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size(); addEventListener('resize', size);
  if (params.get('flock') !== '0') {
    const N = Math.round(Math.min(420, (W * H) / 5200));
    for (let i = 0; i < N; i++) birds.push({ x: Math.random() * W, y: Math.random() * H, vx: Math.random() * 2 - 1, vy: Math.random() * 2 - 1 });
    const colour = ttAccented() ? tt('a') : (document.documentElement.dataset.theme === 'white' && params.get('bg') !== '0' ? '#111' : '#fff');
    if (document.documentElement.dataset.theme === 'white' && params.get('bg') !== '0') document.body.style.setProperty('--scr-bg', '#f4f4f5');
    let t = 0;
    const update = () => {
      t += 0.004;
      // a slowly wandering point the flock is drawn toward
      const gx = W * (0.5 + 0.32 * Math.sin(t * 1.3)), gy = H * (0.5 + 0.28 * Math.sin(t * 0.9 + 1));
      const cell = 60, grid = new Map();
      for (const b of birds) { const k = `${(b.x / cell) | 0},${(b.y / cell) | 0}`; (grid.get(k) || grid.set(k, []).get(k)).push(b); }
      for (const b of birds) {
        let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, n = 0;
        const gxi = (b.x / cell) | 0, gyi = (b.y / cell) | 0;
        for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (const o of grid.get(`${gxi + i},${gyi + j}`) || []) {
          if (o === b) continue;
          const dx = o.x - b.x, dy = o.y - b.y, d2 = dx * dx + dy * dy;
          if (d2 > 3600) continue;
          n++; ax += o.vx; ay += o.vy; cx += o.x; cy += o.y;
          if (d2 < 220) { sx -= dx / (d2 + 1) * 14; sy -= dy / (d2 + 1) * 14; }
        }
        if (n) { b.vx += (ax / n - b.vx) * 0.05 + ((cx / n) - b.x) * 0.0006; b.vy += (ay / n - b.vy) * 0.05 + ((cy / n) - b.y) * 0.0006; }
        b.vx += sx * 0.05 + (gx - b.x) * 0.00006; b.vy += sy * 0.05 + (gy - b.y) * 0.00006;
        const sp = Math.hypot(b.vx, b.vy) || 1, max = 2.6, min = 1.1;
        if (sp > max) { b.vx *= max / sp; b.vy *= max / sp; } else if (sp < min) { b.vx *= min / sp; b.vy *= min / sp; }
        b.x += b.vx; b.y += b.vy;
        if (b.x < -20) b.x = W + 20; if (b.x > W + 20) b.x = -20; if (b.y < -20) b.y = H + 20; if (b.y > H + 20) b.y = -20;
      }
    };
    const draw = () => {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = colour;
      ctx.globalAlpha = 0.75;
      for (const b of birds) { ctx.beginPath(); ctx.ellipse(b.x, b.y, 2.4, 1.3, Math.atan2(b.vy, b.vx), 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
    };
    ttLoop(update, draw);
  }
</script>
</body></html>
