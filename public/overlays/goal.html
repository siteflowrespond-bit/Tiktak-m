<!doctype html>
<html><head><meta charset="utf-8"><title>Goal</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .goal { margin: 10px; padding: 12px 16px 14px; }
  .top span:first-child { font-family: var(--tt-display); }
  .top { display: flex; justify-content: space-between; font-weight: 700; font-size: 20px; margin-bottom: 8px; }
  .bar { position: relative; height: 22px; background: var(--tt-track); border-radius: 11px; overflow: hidden; }
  .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(255,255,255,.35) calc(10% - 2px) 10%); pointer-events: none; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--tt-a), var(--tt-butter)); border-radius: 11px; transition: width .6s ease; box-shadow: 0 0 16px var(--tt-glow); }
  .done .fill { background: var(--tt-mint); }
</style></head>
<body>
<div class="goal panel shadow" id="goal" hidden>
  <div class="top"><span id="label"></span><span id="count"></span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  // ?goal=likes|follows|coins|shares
  const key = params.get('goal') || 'likes';
  let goal = null, value = 0;
  const socket = io();
  socket.on('config', (c) => { goal = c.goals[key]; render(); });
  socket.on('stats', (s) => { value = s[key] || 0; render(); });
  function render() {
    const box = document.getElementById('goal');
    if (!goal || !goal.enabled) { box.hidden = true; return; }
    box.hidden = false;
    const pct = Math.min(100, (value / goal.target) * 100);
    document.getElementById('label').textContent = goal.label;
    document.getElementById('count').textContent = `${fmt(value)} / ${fmt(goal.target)}`;
    document.getElementById('fill').style.width = pct + '%';
    box.classList.toggle('done', pct >= 100);
  }
</script>
</body></html>
