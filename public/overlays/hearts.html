<!doctype html>
<html><head><meta charset="utf-8"><title>Like hearts</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .h { position: fixed; bottom: -40px; width: 34px; height: 34px; pointer-events: none; animation: rise var(--t) ease-out forwards; }
  .h svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .h img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes rise {
    0% { transform: translate(0, 0) scale(.6); opacity: 0 }
    10% { opacity: 1 }
    100% { transform: translate(var(--dx), calc(-1 * var(--h))) scale(1.1) rotate(var(--r)); opacity: 0 }
  }
</style></head>
<body>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  // Floating hearts for likes, and floating gift icons for gifts. ?max=60 (hearts on screen)  ?side=right|left|center
  const max = Number(params.get('max') || 60);
  const side = params.get('side') || 'right';
  const colors = ['#ff4d6d', '#ff8fa3', '#ffd166', '#f15bb5', '#e5383b', '#ff7b00'];
  const heart = (c) => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 21s-7.5-4.6-9.6-9.3C.8 8 3 4 6.9 4c2.1 0 3.6 1.1 5.1 2.9C13.5 5.1 15 4 17.1 4 21 4 23.2 8 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>`;
  let alive = 0;

  function spawn(content) {
    if (alive >= max) return;
    alive++;
    const d = el('div', { class: 'h' });
    if (typeof content === 'string') d.innerHTML = content; else d.append(content);
    const w = innerWidth;
    const x = side === 'left' ? w * 0.05 + Math.random() * w * 0.25 : side === 'center' ? w * 0.35 + Math.random() * w * 0.3 : w * 0.7 + Math.random() * w * 0.25;
    d.style.left = `${x}px`;
    d.style.setProperty('--t', `${2.2 + Math.random() * 1.6}s`);
    d.style.setProperty('--dx', `${(Math.random() - 0.5) * 120}px`);
    d.style.setProperty('--h', `${innerHeight * (0.6 + Math.random() * 0.4)}px`);
    d.style.setProperty('--r', `${(Math.random() - 0.5) * 50}deg`);
    document.body.append(d);
    d.addEventListener('animationend', () => { d.remove(); alive--; });
  }

  io().on('event', (e) => {
    if (e.type === 'like') {
      const n = Math.min(e.likes, 12);
      for (let i = 0; i < n; i++) setTimeout(() => spawn(heart(colors[Math.floor(Math.random() * colors.length)])), i * 90);
    }
    if (e.type === 'gift' && e.gift.image) {
      const n = Math.min(e.gift.count, 10);
      for (let i = 0; i < n; i++) setTimeout(() => spawn(el('img', { src: e.gift.image, alt: '', referrerPolicy: 'no-referrer' })), i * 120);
    }
  });
</script>
</body></html>
