<html><head><meta charset="utf-8"><title>Chat</title>
<link rel="stylesheet" href="overlay.css">
<style>
  #list { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; background: var(--tt-panel); color: var(--tt-text); padding: 7px 12px 7px 8px; border: 1px solid var(--tt-line);
    border-radius: 16px; font-size: 18px; animation: slide .25s ease both; }
  .msg .name { font-weight: 800; color: var(--tt-sky); margin-right: 6px; }
  .msg.gift .name { color: var(--tt-butter); }
  .msg.gift { box-shadow: inset 3px 0 0 var(--tt-butter); }
  .msg.follow .name, .msg.share .name { color: var(--tt-a); }
  .msg .body { overflow-wrap: anywhere; min-width: 0; }
  .msg .gimg { width: 22px; height: 22px; object-fit: contain; vertical-align: -5px; margin-left: 4px; }
  .badge { display: inline-block; margin-right: 5px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 900; letter-spacing: .5px; line-height: 18px; vertical-align: 2px;
    background: var(--tt-a); color: var(--tt-on-accent); text-shadow: none; }
  .badge.soft { background: transparent; color: var(--tt-text); box-shadow: inset 0 0 0 1.5px var(--tt-line); }
  .msg.out { animation: out .4s ease forwards; }
  body.big .msg { font-size: 24px; padding: 9px 14px 9px 10px; }
  @keyframes slide { from { transform: translateX(-20px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes out { to { transform: translateX(-20px); opacity: 0 } }
</style></head>
<body>
<div id="list"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  // ?max=8  ?events=0 (chat only, no gifts/follows/shares)  ?fade=30 (seconds before a message disappears, 0 = never)
  // ?commands=0 (hide messages that start with !)  ?badges=0 (no MOD / SUB / host badges)  ?size=big
  const max = Number(params.get('max') || 8);
  const showEvents = params.get('events') !== '0';
  const hideCommands = params.get('commands') === '0';
  const badges = params.get('badges') !== '0';
  const fade = Number(params.get('fade') || 0);
  const list = document.getElementById('list');
  if (params.get('size') === 'big') document.body.classList.add('big');
  const socket = io();
  ttHint('Chat messages appear here.');
  const remove = (row) => { row.classList.add('out'); setTimeout(() => row.remove(), 400); };
  function badgesOf(u = {}) {
    if (!badges) return [];
    if (u.isHost) return [el('span', { class: 'badge' }, 'HOST')];
    const out = [];
    if (u.isModerator) out.push(el('span', { class: 'badge' }, 'MOD'));
    if (u.isSubscriber) out.push(el('span', { class: 'badge soft' }, 'SUB'));
    return out;
  }

  socket.on('event', (e) => {
    let body;
    if (e.type === 'chat') { if (hideCommands && e.comment.trim().startsWith('!')) return; body = e.comment; }
    else if (!showEvents) return;
    else if (e.type === 'gift') body = [`sent ${e.gift.count > 1 ? `${e.gift.count}× ` : ''}${e.gift.name}`, e.gift.image ? el('img', { class: 'gimg', src: e.gift.image, alt: '', referrerPolicy: 'no-referrer' }) : null];
    else if (e.type === 'follow') body = 'followed';
    else if (e.type === 'share') body = 'shared the LIVE';
    else return;
    const row = el('div', { class: `msg shadow ${e.type}` },
      avatarEl(e.user, 28),
      el('div', { class: 'body' }, ...badgesOf(e.user), el('span', { class: 'name' }, e.user.nickname), body));
    ttHint('');
    list.append(row);
    const live = [...list.children].filter((r) => !r.classList.contains('out'));
    for (const r of live.slice(0, Math.max(0, live.length - max))) r.remove();
    if (fade) setTimeout(() => remove(row), fade * 1000);
  });
</script>
</body></html>
