<html><head><meta charset="utf-8"><title>Alerts</title>
<link rel="stylesheet" href="overlay.css">
<style>
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .alert { display: flex; align-items: center; gap: 18px; max-width: min(92vw, 760px); padding: 18px 26px 18px 18px;
    background: var(--tt-panel); color: var(--tt-text); border: 1px solid var(--tt-line); border-left: 6px solid var(--tt-a); border-radius: 16px; position: relative; overflow: hidden;
    box-shadow: 0 18px 44px -16px rgba(0,0,0,.75), 0 0 40px -12px var(--tt-glow);
    animation: in .35s cubic-bezier(.2,1.3,.4,1) both; }
  .alert.no-img { padding-left: 24px; }
  .alert.out { animation: out .3s ease forwards; }
  .alert img { width: 84px; height: 84px; object-fit: contain; border-radius: 6px; flex: none; }
  .alert .text { font-family: var(--tt-display); font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -.5px; overflow-wrap: anywhere; }
  .alert .text .who { color: var(--tt-a); }
  .alert .avatar { width: 84px; height: 84px; font-size: 38px; }
  .alert .glow { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.14) 50%, transparent 70%); transform: translateX(-100%); animation: sweep 1.1s .25s ease-out both; }
  @keyframes sweep { to { transform: translateX(100%); } }
  .alert .timebar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--tt-a); transform-origin: left; animation: drain linear forwards; }
  @keyframes drain { to { transform: scaleX(0); } }
  body.plain .alert { background: none; border: 0; padding: 0; flex-direction: column; text-align: center; box-shadow: none; color: var(--tt-text); }
  body.plain .alert .glow { display: none; }
  body.plain .alert .timebar { display: none; }
  body.plain .alert img { width: 160px; height: 160px; }
  body.plain .alert .text { font-size: 42px; }
  @keyframes in { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
  body.a-pop .alert { animation-name: pop; animation-duration: .5s; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0 } 60% { transform: scale(1.06); opacity: 1 } 100% { transform: none } }
  body.a-drop .alert { animation-name: drop; animation-duration: .6s; }
  @keyframes drop { 0% { transform: translateY(-120px) rotate(-4deg); opacity: 0 } 55% { transform: translateY(8px) rotate(1deg); opacity: 1 } 100% { transform: none } }
  body.a-side .alert { animation-name: side; }
  @keyframes side { from { transform: translateX(-60px); opacity: 0 } }
  @keyframes out { to { transform: translateY(-12px); opacity: 0 } }
  #unlock { position: fixed; bottom: 10px; left: 10px; background: #000c; padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
</style></head>
<body>
<div id="stage"></div>
<div id="unlock" hidden>Sound is blocked. Click here once.</div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script src="sound.js"></script>
<script src="tts.js"></script>
<script>
  // ?volume=0.5  ?tts=0  ?sounds=0 (don't play sound actions)  ?style=plain (no box)  ?anim=slide|pop|drop|side  ?accent=25f4ee
  const socket = io();
  const stage = document.getElementById('stage');
  const queue = [];
  let busy = false, cfg = null;
  const ttsOn = params.get('tts') !== '0';
  const volume = Number(params.get('volume') ?? 1);
  if (params.get('style') === 'plain') document.body.classList.add('plain');
  if (['pop', 'drop', 'side'].includes(params.get('anim'))) document.body.classList.add(`a-${params.get('anim')}`);
  ttHint('Alerts pop up here. Press Test on an alert, or send a test event.');

  const play = playSounds(params.get('sounds') === '0' ? { on() {} } : socket, { masterVolume: volume });
  window.addEventListener('sound-blocked', () => { document.getElementById('unlock').hidden = false; });
  document.getElementById('unlock').onclick = (e) => { e.target.hidden = true; };

  socket.on('config', (c) => { cfg = c; });
  socket.on('alert', (a) => {
    ttHint('');
    if (queue.length >= 30) queue.shift(); // a flood of events never builds up minutes of waiting alerts
    queue.push(a); next();
  });
  if (ttsOn) startTts(socket, { volume });

  /** The alert text with the viewer's name picked out in the accent colour. */
  function withName(text, name) {
    const i = name ? text.indexOf(name) : -1;
    if (i < 0) return text;
    return [text.slice(0, i), el('span', { class: 'who' }, name), text.slice(i + name.length)].filter((x) => x !== '');
  }

  function next() {
    if (busy || !queue.length) return;
    busy = true;
    const a = queue.shift();
    const box = el('div', { class: 'alert shadow' });
    // the picture: the alert's image, else the viewer's initial (so an alert never looks empty)
    const fallback = () => (a.user?.nickname ? avatarEl(a.user, 84) : null);
    if (a.image) {
      const img = el('img', { src: a.image, alt: '', referrerPolicy: 'no-referrer' });
      img.onerror = () => { const f = fallback(); if (f) img.replaceWith(f); else { img.remove(); box.classList.add('no-img'); } };
      box.append(img);
    } else if (fallback()) box.append(fallback());
    else box.classList.add('no-img');
    box.append(el('div', { class: 'text' }, withName(a.text, a.user?.nickname)), el('i', { class: 'glow' }), el('i', { class: 'timebar', style: `animation-duration:${a.duration || 4}s` }));
    stage.replaceChildren(box);
    if (a.sound) play(a.sound, 1);
    setTimeout(() => {
      box.classList.add('out');
      setTimeout(() => { box.remove(); busy = false; next(); }, 300);
    }, (a.duration || 4) * 1000);
  }

</script>
</body></html>
