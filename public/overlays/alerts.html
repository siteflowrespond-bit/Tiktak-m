<!doctype html>
<html><head><meta charset="utf-8"><title>Alerts</title>
<link rel="stylesheet" href="overlay.css">
<style>
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .alert { display: flex; align-items: center; gap: 18px; max-width: min(92vw, 760px); padding: 18px 26px 18px 18px;
    background: var(--tt-panel); color: var(--tt-text); border: 1px solid var(--tt-line); border-left: 6px solid var(--accent, var(--tt-a)); border-radius: 16px; position: relative; overflow: hidden;
    box-shadow: 0 18px 44px -16px rgba(0,0,0,.75), 0 0 40px -12px var(--tt-glow);
    animation: in .35s cubic-bezier(.2,1.3,.4,1) both; }
  .alert.no-img { padding-left: 24px; }
  .alert.out { animation: out .3s ease forwards; }
  .alert img { width: 84px; height: 84px; object-fit: contain; border-radius: 6px; flex: none; }
  .alert .text { font-family: var(--tt-display); font-size: 36px; font-weight: 800; line-height: 1.1; letter-spacing: -.5px; }
  .alert .timebar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--accent, var(--tt-a)); transform-origin: left; animation: drain linear forwards; }
  @keyframes drain { to { transform: scaleX(0); } }
  :root[data-theme="candy"] .alert .text { text-shadow: none; }
  body.plain .alert { background: none; border: 0; padding: 0; flex-direction: column; text-align: center; box-shadow: none; color: #fff; }
  body.plain .alert .timebar { display: none; }
  body.plain .alert img { width: 160px; height: 160px; }
  body.plain .alert .text { font-size: 42px; }
  @keyframes in { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes out { to { transform: translateY(-12px); opacity: 0 } }
  #unlock { position: fixed; bottom: 10px; left: 10px; background: #000c; padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
</style></head>
<body>
<div id="stage"></div>
<div id="unlock" hidden>Sound is blocked. Click here once.</div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script src="sound.js"></script>
<script>
  // ?volume=0.5  ?tts=0  ?sounds=0 (don't play sound actions)  ?style=plain  ?accent=%2325f4ee
  const socket = io();
  const stage = document.getElementById('stage');
  const queue = [];
  let busy = false, cfg = null;
  const ttsOn = params.get('tts') !== '0';
  const volume = Number(params.get('volume') ?? 1);
  if (params.get('style') === 'plain') document.body.classList.add('plain');
  if (params.get('accent')) document.documentElement.style.setProperty('--accent', params.get('accent'));

  const play = playSounds(params.get('sounds') === '0' ? { on() {} } : socket, { masterVolume: volume });
  window.addEventListener('sound-blocked', () => { document.getElementById('unlock').hidden = false; });
  document.getElementById('unlock').onclick = (e) => { e.target.hidden = true; };

  socket.on('config', (c) => { cfg = c; });
  socket.on('alert', (a) => { queue.push(a); next(); });
  socket.on('tts', ({ text }) => speak(text));

  function next() {
    if (busy || !queue.length) return;
    busy = true;
    const a = queue.shift();
    const box = el('div', { class: 'alert shadow' });
    if (a.image) {
      const img = el('img', { src: a.image, alt: '', referrerPolicy: 'no-referrer' });
      img.onerror = () => { img.remove(); box.classList.add('no-img'); };
      box.append(img);
    } else box.classList.add('no-img');
    box.append(el('div', { class: 'text' }, a.text), el('i', { class: 'timebar', style: `animation-duration:${a.duration || 4}s` }));
    stage.replaceChildren(box);
    if (a.sound) play(a.sound, 1);
    setTimeout(() => {
      box.classList.add('out');
      setTimeout(() => { box.remove(); busy = false; next(); }, 300);
    }, (a.duration || 4) * 1000);
  }

  function speak(text) {
    if (!ttsOn || !window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    if (cfg) {
      const v = speechSynthesis.getVoices().find((x) => x.name === cfg.tts.voice);
      if (v) u.voice = v;
      u.rate = cfg.tts.rate || 1;
    }
    u.volume = volume;
    speechSynthesis.speak(u);
  }
</script>
</body></html>
