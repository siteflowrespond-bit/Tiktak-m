<html><head><meta charset="utf-8"><title>Ticker</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .bar { margin: 10px; padding: 8px 10px; display: flex; gap: 6px; font-size: 17px; align-items: stretch; }
  .bar > span { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1; padding: 4px 12px; border-radius: 12px; }
  .bar > span + span { border-left: 1px solid var(--tt-line); border-radius: 0; }
  .bar small { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; opacity: .65; }
  .bar b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar b.new { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
</style></head>
<body>
<div class="bar panel shadow">
  <span><small>Latest follower</small><b id="follow">—</b></span>
  <span><small>Latest gift</small><b id="gift">—</b></span>
  <span><small>Latest share</small><b id="share">—</b></span>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  const socket = io();
  const set = (id, text, anim = true) => { const b = document.getElementById(id); b.textContent = text; b.title = text; b.classList.remove('new'); if (anim) { void b.offsetWidth; b.classList.add('new'); } };
  function show(e, anim) {
    if (e.type === 'follow') set('follow', e.user.nickname, anim);
    if (e.type === 'share') set('share', e.user.nickname, anim);
    if (e.type === 'gift') set('gift', `${e.user.nickname} · ${e.gift.count > 1 ? `${e.gift.count}× ` : ''}${e.gift.name}`, anim);
  }
  socket.on('event', (e) => show(e, true));
  // catch up when the overlay opens (OBS reloads sources when you switch scenes)
  socket.on('recent', (list) => { for (const e of [...(list || [])].reverse()) show(e, false); });
</script>
</body></html>
