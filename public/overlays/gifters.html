<html><head><meta charset="utf-8"><title>Leaderboard</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .box { margin: 10px; padding: 10px 14px; }
  h3 { margin: 0 0 6px; font-family: var(--tt-display); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; opacity: .85; }
  .row { display: flex; gap: 10px; align-items: center; padding: 4px 0; font-size: 17px; }
  .rank { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border-radius: 8px; font-size: 13px; font-weight: 900; opacity: .7; }
  .row:nth-child(-n+3) .rank { opacity: 1; border: 1.5px solid var(--tt-a); }
  .row:nth-child(1) .rank { background: var(--tt-a); color: var(--tt-on-accent); }
  .row:nth-child(1) .avatar { box-shadow: 0 0 0 2px var(--tt-a), 0 0 14px var(--tt-glow); }
  .amt { color: var(--tt-butter); }
  .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt { font-weight: 700; }
  .empty { opacity: .7; font-size: 15px; padding: 4px 0; }
</style></head>
<body>
<div class="box panel shadow"><h3 id="title"></h3><div id="rows"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  // ?by=coins|likes|comments  ?count=5  ?title=Top%20supporters
  const by = ['likes', 'comments'].includes(params.get('by')) ? params.get('by') : 'coins';
  const count = Number(params.get('count') || 5);
  document.getElementById('title').textContent = params.get('title') || ({ likes: 'Top likers', comments: 'Top chatters' }[by] || 'Top gifters');
  io().on('stats', (s) => {
    const list = ({ likes: s.topLikers, comments: s.topChatters }[by] || s.topGifters) || [];
    const rows = list.slice(0, count).map((g, i) =>
      el('div', { class: 'row' }, el('span', { class: 'rank num' }, i + 1), avatarEl(g.user, 28),
        el('span', { class: 'name' }, g.user.nickname), el('span', { class: 'amt num' }, `${fmt(g[by])} ${{ likes: 'likes', comments: g[by] === 1 ? 'message' : 'messages' }[by] || 'coins'}`)));
    document.getElementById('rows').replaceChildren(...(rows.length ? rows : [el('div', { class: 'empty' }, 'Nobody yet')]));
  });
</script>
</body></html>
