<html><head><meta charset="utf-8"><title>Leaderboard</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .box { margin: 10px; padding: 10px 14px; }
  h3 { margin: 0 0 6px; font-family: var(--tt-display); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; opacity: .85; }
  .row { display: flex; gap: 10px; align-items: center; padding: 4px 0; font-size: 17px; }
  .rank { width: 20px; font-weight: 800; opacity: .7; }
  .row:nth-child(1) .rank { color: var(--tt-butter); opacity: 1; }
  .row:nth-child(1) .avatar { box-shadow: 0 0 0 2px var(--tt-butter), 0 0 14px var(--tt-butter); }
  .amt { color: var(--tt-butter); }
  .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt { font-weight: 700; }
  .empty { opacity: .7; font-size: 15px; padding: 4px 0; }
</style></head>
<body>
<div class="box panel shadow"><h3 id="title"></h3><div id="rows"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  // ?by=coins|likes  ?count=5  ?title=Top%20supporters
  const by = params.get('by') === 'likes' ? 'likes' : 'coins';
  const count = Number(params.get('count') || 5);
  document.getElementById('title').textContent = params.get('title') || (by === 'likes' ? 'Top likers' : 'Top gifters');
  io().on('stats', (s) => {
    const list = (by === 'likes' ? s.topLikers : s.topGifters) || [];
    const rows = list.slice(0, count).map((g, i) =>
      el('div', { class: 'row' }, el('span', { class: 'rank num' }, i + 1), avatarEl(g.user, 28),
        el('span', { class: 'name' }, g.user.nickname), el('span', { class: 'amt num' }, `${fmt(g[by])} ${by === 'likes' ? 'likes' : 'coins'}`)));
    document.getElementById('rows').replaceChildren(...(rows.length ? rows : [el('div', { class: 'empty' }, 'Nobody yet')]));
  });
</script>
</body></html>
