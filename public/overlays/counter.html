<!doctype html>
<html><head><meta charset="utf-8"><title>Counter</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .c { display: inline-flex; align-items: baseline; gap: 10px; margin: 10px; padding: 8px 16px; }
  .v { font-size: 44px; font-weight: 800; }
  .l { font-size: 18px; font-weight: 600; opacity: .8; }
  .v.tick { animation: tick .3s ease; }
  @keyframes tick { 50% { transform: translateY(-3px); color: #ffd166 } }
</style></head>
<body>
<div class="c panel shadow" id="c"><span class="v num" id="v">0</span><span class="l" id="l"></span></div>
<script src="/socket.io/socket.io.js"></script>
<script src="common.js"></script>
<script>
  // ?stat=likes|viewers|coins|follows|shares|comments|gifts  ?label=Likes  ?bg=0
  const stat = params.get('stat') || 'likes';
  const names = { likes: 'likes', viewers: 'watching', coins: 'coins', follows: 'new followers', shares: 'shares', comments: 'comments', gifts: 'gifts' };
  document.getElementById('l').textContent = params.get('label') ?? names[stat] ?? stat;
  if (params.get('bg') === '0') document.getElementById('c').classList.remove('panel');
  let last = -1;
  io().on('stats', (s) => {
    const v = document.getElementById('v');
    const n = s[stat] || 0;
    v.textContent = fmt(n);
    if (last >= 0 && n > last) { v.classList.remove('tick'); void v.offsetWidth; v.classList.add('tick'); }
    last = n;
  });
</script>
</body></html>
